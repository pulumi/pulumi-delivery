# Uploads the plugin archives to get.pulumi.com. No GitHub release, no SDK publish (the SDK stays private).
# Release steps: push the tag vX.Y.Z or vX.Y.Z-alpha.N. GoReleaser stamps the version from the tag.
name: release
on:
  push:
    tags:
    - v*
permissions:
  contents: read
  id-token: write # For ESC secrets.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - env:
        ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
        ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
        ESC_ACTION_OIDC_AUTH: "true"
        ESC_ACTION_OIDC_ORGANIZATION: pulumi
        ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
      id: esc-secrets
      name: Fetch secrets from ESC
      uses: pulumi/esc-action@57e332b6dfb0d7edcf6cb813ee9a98b9665f12c2
    - name: Check the tag format
      run: |
        [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]] || { echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z or vX.Y.Z-alpha.N"; exit 1; }
    - name: Install the pinned Pulumi CLI
      run: |
        curl -fsSL https://get.pulumi.com | sh -s -- --version "$(make -s pulumi-version)"
        echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
    - name: Check the generated SDK is current
      run: make check-sdk
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: provider/go.mod
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ steps.esc-secrets.outputs.AWS_ACCESS_KEY_ID }}
        aws-region: us-east-2
        aws-secret-access-key: ${{ steps.esc-secrets.outputs.AWS_SECRET_ACCESS_KEY }}
        role-duration-seconds: 7200
        role-session-name: delivery@githubActions
        role-external-id: upload-pulumi-release
        role-to-assume: ${{ steps.esc-secrets.outputs.AWS_UPLOAD_ROLE_ARN }}
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@5742e2a039330cbb23ebf35f046f814d4c6ff811 # v5.1.0
      env:
        GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      with:
        args: release --clean --timeout 60m0s
        version: "~> v2"
