name: delivery-yaml
runtime: yaml
description: A Delivery pipeline in YAML.
resources:
  code:
    type: delivery:GitHubSource
    properties:
      repository: acme/shop
      branch: main
      trigger:
        paths:
          - src/**
  shop:
    type: delivery:Pipeline
  dev:
    type: delivery:Stage
    properties:
      pipeline: ${shop}
  prod:
    type: delivery:Stage
    properties:
      pipeline: ${shop}
      from:
        - ${dev}
      when:
        kind: approval
  test:
    type: delivery:Job
    properties:
      stage: ${dev}
      source: ${code}
      directory: app
      command: npm test
  services:
    type: delivery:Stacks
    properties:
      stage: ${dev}
      stacks:
        api:
          stack: shop-api/dev
          source: ${code}
          directory: api
outputs:
  release: ${shop.releaseNumber}
