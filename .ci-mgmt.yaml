provider: delivery
major-version: 0
providerDefaultBranch: main
template: generic
esc:
  enabled: true
# make lint reports 125 findings (gci 3, goconst 50, gosec 10, lll 50, revive 10, staticcheck 1, unused 1; goconst and lll are capped at 50); disabled until they are fixed.
lint: false
useJavaPackageGenSdk: true
useDotnetPackageGenSdk: true
useNodejsPackageGenSdk: true
useGoPackageGenSdk: true
usePythonPackageGenSdk: true
useProviderBinarySchemaGen: true
# The main package lives in provider/ (module .../provider), not provider/cmd/pulumi-resource-delivery, and the version is main.Version.
buildProviderCmd: cd provider && GOOS=$(1) GOARCH=$(2) CGO_ENABLED=0 go build -o "$(3)" -ldflags "-s -w -X main.Version=$(PROVIDER_VERSION)" .
# The generated default tests only the root package with a Terraform bridge coverpkg; run every package, including provider/cloudclient.
# In CI this runs right after make schema, so it also fails when the committed schema is not the schema of the provider.
testProviderCmd: cd provider && $(GO_TEST_EXEC) -v -short -parallel $(TESTPARALLELISM) ./... && { [ -z "$$CI" ] || git diff --exit-code -- cmd/pulumi-resource-delivery/schema.json; }
