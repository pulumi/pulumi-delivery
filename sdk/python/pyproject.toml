[project]
  name = "pulumi_delivery"
  description = "Define pipelines, stages and jobs in a Pulumi program."
  dependencies = ["packaging>=24.0", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "delivery", "category/utility", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.2.0"
  [project.urls]
    Homepage = "https://github.com/pulumi/pulumi-delivery"
    Repository = "https://github.com/pulumi/pulumi-delivery"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_delivery = ["py.typed", "pulumi-plugin.json"]
