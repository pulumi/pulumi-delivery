# The Makefile and CI read .config/mise.toml (generated by ci-mgmt); this file adds to it.

# vfox-dotnet v0.3.1 and v0.3.2 (2026-11-17) fail to list .NET versions, and mise clones the plugin's
# default branch. Pin the last commit that works. Remove this once the plugin is fixed upstream.
[plugins]
vfox-version-fox-vfox-dotnet = "https://github.com/version-fox/vfox-dotnet#5cbf1758e786f09213a3c0b82153f7cfa977a3ab"
